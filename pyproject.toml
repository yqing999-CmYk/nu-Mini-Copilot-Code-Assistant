[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeassist"
version = "0.1.0"
description = "Lightweight CLI code assistant"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "textual>=0.70",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
]

[project.scripts]
codeassist = "codeassist.cli:app"

[tool.ruff]
line-length = 100
